    <text x="60" y="186" font-size="23" fill="#9fb3c8">ShadowsocksR 网页管理面板：Flask + Docker 一键部署，浏览器点按钮管理节点、用户、</text><text x="60" y="222" font-size="23" fill="#9fb3c8">流量和日志，手机也能用</text>
